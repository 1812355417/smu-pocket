# JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 【JDK 17 说明】
# 本项目需要 JDK 17：AGP 8.7.3 不支持 JDK 21+，
# 而 Android Studio 自带的 JBR 是 JDK 25，直接构建会报 "What went wrong: 25.0.4"。
#
# 两种解决办法（任选其一，不要写在本文件里 —— 那是机器相关配置）：
#   1. AS 里设：Settings → Build Tools → Gradle → Gradle JDK → 选 17
#   2. 建用户级文件 ~/.gradle/gradle.properties，加一行：
#        org.gradle.java.home=C:/path/to/your/jdk-17
#
# 本项目不提交任何绝对路径，保证 clone 后即可构建。

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true